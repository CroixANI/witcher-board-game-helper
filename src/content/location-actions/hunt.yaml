title: 'Задание на выслеживание'
iconHint: '«+1 золото» и «+ след»'
icon: loc-hunt.svg
steps:
  - 'Сразу возьмите 1 золото.'
  - 'Выберите монстра, на которого у вас нет ни следа, ни задания на выслеживание.'
  - 'Возьмите случайный жетон локации его типа местности, положите лицом вверх рядом с собой и сверху 1 золото из запаса. Выпала текущая локация — возьмите другой жетон.'
  - 'Придя в локацию с жетона: заберите золото и переверните жетон лицом вниз — это след.'
